[package]
name = "hacker-term"
version = "0.8.0"
description = "HackerTerm – a high-fidelity terminal emulator"
authors = ["HackerOS Team"]
edition = "2021"

[lib]
name = "hacker_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hacker-term"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-proxy"] }
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "5"
indexmap = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
